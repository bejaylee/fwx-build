name: Build fwx

run-name: Build fwx.ko for iStoreOS 24.10.8 (kernel 6.6.144)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-fwx.yml'
      - 'package/fcm/fwx/**'

env:
  SDK_URL: https://downloads.openwrt.org/releases/24.10.8/targets/x86/64/openwrt-sdk-24.10.8-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst
  FORCE_UNSAFE_CONFIGURE: "1"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential ccache curl file flex gawk gettext git \
            libelf-dev libncurses-dev libssl-dev patch python3 \
            python3-pyelftools rsync unzip wget xsltproc zstd 2>&1 | tail -3

      - name: Download OpenWrt SDK
        run: |
          wget -q --show-progress "$SDK_URL" -O sdk.tar.zst
          ls -lh sdk.tar.zst
          mkdir sdk
          tar --zstd -xf sdk.tar.zst -C sdk --strip-components=1
          rm sdk.tar.zst
          echo "SDK extracted"
          grep "LINUX_VERSION" sdk/include/kernel-6.6 2>/dev/null | head -3 || true

      - name: Inject fwx package
        run: |
          mkdir -p sdk/package/fcm
          cp -r package/fcm/fwx sdk/package/fcm/fwx
          echo "Injected files:"
          find sdk/package/fcm/fwx -type f

      - name: Update feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update base 2>&1 | tail -5
          ./scripts/feeds install -p base libmnl 2>/dev/null || true

      - name: Configure
        working-directory: sdk
        run: |
          printf 'CONFIG_DEVEL=y\nCONFIG_CCACHE=y\nCONFIG_PACKAGE_kmod-fwx=m\n' > .config
          make defconfig 2>&1 | tail -10
          grep fwx .config || echo "WARNING: fwx not in config"

      - name: Build fwx module
        working-directory: sdk
        run: |
          set -o pipefail
          make package/fcm/fwx/compile V=s 2>&1 | tee build.log

      - name: Find outputs
        working-directory: sdk
        run: |
          echo "=== fwx.ko ==="
          find build_dir -name "fwx.ko" -type f 2>/dev/null
          echo "=== ipk ==="
          find bin -name "*fwx*" -type f 2>/dev/null

      - name: Collect artifact
        if: always()
        working-directory: sdk
        run: |
          mkdir -p ../artifact
          KO=$(find build_dir -name "fwx.ko" -type f 2>/dev/null | head -1)
          if [ -n "$KO" ]; then
            cp "$KO" ../artifact/fwx.ko
            echo "fwx.ko collected"
            file ../artifact/fwx.ko
            strings ../artifact/fwx.ko | grep -i vermagic | head -3
          else
            echo "::error::fwx.ko NOT FOUND - build failed"
            exit 1
          fi
          IPK=$(find bin -name "*fwx*.ipk" -type f 2>/dev/null | head -1)
          if [ -n "$IPK" ]; then
            cp "$IPK" ../artifact/
          fi
          cp build.log ../artifact/ 2>/dev/null || true
          ls -la ../artifact/

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fwx-ko
          path: artifact/
          retention-days: 30
